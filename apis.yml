name: The House Of LR&C
description: >-
  The House of LR&C (Love, Respect & Care) is a Seattle-based, mission-driven
  direct-to-consumer fashion company founded in 2020 by Russell Wilson, Ciara,
  and retail veteran Christine Day. A Certified B Corporation, it operates a
  portfolio of apparel brands including Good Man Brand, LITA by Ciara, and Human
  Nation, donating 3% of net revenue to the Why Not You Foundation. It was
  surfaced as a portfolio company of Lightspeed Venture Partners and added to the
  API Evangelist network. Its public commerce runs on Shopify; the company
  publishes no first-party developer API, SDKs, or developer documentation. The
  only machine-readable surface on the storefront host is Shopify's platform-level
  Customer Account API OIDC discovery document.
